name: Release

on:
  push:
    branches: [master]
    tags:
      - "v*" # Push events to matching v*, i.e. v1.0, v20.15.10

permissions:
  contents: read

jobs:
  version:
    runs-on: ubuntu-latest
    outputs:
      ref: ${{ steps.version-tag-ref.outputs.ref }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6.4.0
        with:
          go-version-file: go.mod
      - id: version-tag-ref
        run: |
          if [[ '${{ github.ref_type }}' = 'tag' ]]; then
            ref='${{ github.ref }}'
            echo "ref=${ref#refs/tags/}" >>"$GITHUB_OUTPUT"
            go run -ldflags="-X main.version=${ref#refs/tags/}" ./cmd/validate_semver
          else
            echo "ref=v0.0.0+${{ github.sha }}" >>"$GITHUB_OUTPUT"
          fi

  # Wails v2 uses native WebViews and CGO, so each platform must be built on its
  # own native runner (cross-compilation is not supported).
  build:
    name: build ${{ matrix.artifact_name }}
    needs: version
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: windows-latest
            platform: windows/amd64
            exec_name: pear-desktop-twitch-song-requests_windows_x64.exe
            artifact_name: pear-desktop-twitch-song-requests_windows_x64
          - runner: windows-11-arm
            platform: windows/arm64
            exec_name: pear-desktop-twitch-song-requests_windows_on_arm.exe
            artifact_name: pear-desktop-twitch-song-requests_windows_on_arm
          - runner: ubuntu-latest
            platform: linux/amd64
            exec_name: pear-desktop-twitch-song-requests_linux_amd64
            artifact_name: pear-desktop-twitch-song-requests_linux_amd64
          - runner: ubuntu-24.04-arm
            platform: linux/arm64
            exec_name: pear-desktop-twitch-song-requests_linux_arm64
            artifact_name: pear-desktop-twitch-song-requests_linux_arm64
          - runner: macos-13
            platform: darwin/amd64
            exec_name: pear-desktop-twitch-song-requests_macos_intel
            artifact_name: pear-desktop-twitch-song-requests_macos_intel
          - runner: macos-14
            platform: darwin/arm64
            exec_name: pear-desktop-twitch-song-requests_macos_apple_silicon
            artifact_name: pear-desktop-twitch-song-requests_macos_apple_silicon
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - uses: voidzero-dev/setup-vp@2dec1e33f4ab2c6d5bce1b0c4607961bb1a3f7a1 # v1.1.2
        with:
          node-version-file: ".node-version"
          cache: true
          run-install: true
      - uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6.4.0
        with:
          go-version-file: go.mod
      - name: Install Linux Wails dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.1-dev
      - name: Install Wails CLI
        run: go install github.com/wailsapp/wails/v2/cmd/wails@v2.12.0
      - name: Build frontend
        shell: bash
        run: vp run build
      - name: Build desktop app
        shell: bash
        working-directory: cmd/main
        run: |
          wails build -s -skipbindings -m -trimpath \
            -platform "${{ matrix.platform }}" \
            -ldflags "-X main.version=${{ needs.version.outputs.ref }}" \
            -o "${{ matrix.exec_name }}"
      - name: Stage artifact
        shell: bash
        run: |
          mkdir -p dist
          if [[ '${{ runner.os }}' == 'macOS' ]]; then
            app="$(ls -d cmd/main/build/bin/*.app | head -n1)"
            ditto -c -k --keepParent "$app" "dist/${{ matrix.artifact_name }}.zip"
          else
            cp "cmd/main/build/bin/${{ matrix.exec_name }}" "dist/${{ matrix.exec_name }}"
          fi
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ matrix.artifact_name }}
          path: dist/*
          compression-level: 0
          if-no-files-found: error
          archive: false

  publish:
    needs: [version, build]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: pear-desktop-twitch-song-requests_*
          merge-multiple: true
      - uses: softprops/action-gh-release@b4309332981a82ec1c5618f44dd2e27cc8bfbfda # v3.0.0
        if: github.ref_type == 'tag'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          name: Release ${{ needs.version.outputs.ref }}
          prerelease: ${{ contains(github.ref, '-rc') }}
          make_latest: true
          generate_release_notes: true
          preserve_order: true
          fail_on_unmatched_files: true
          files: |
            pear-desktop-twitch-song-requests_windows_x64.exe
            pear-desktop-twitch-song-requests_windows_on_arm.exe
            pear-desktop-twitch-song-requests_linux_amd64
            pear-desktop-twitch-song-requests_linux_arm64
            pear-desktop-twitch-song-requests_macos_intel.zip
            pear-desktop-twitch-song-requests_macos_apple_silicon.zip
