name: Build nightly

on:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6.4.0
        with:
          go-version-file: go.mod
      - name: Install Linux Wails dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.1-dev
      - run: |
          mkdir -p cmd/main/frontend
          touch cmd/main/frontend/index.html
          go test ./...

  test-web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - uses: voidzero-dev/setup-vp@2dec1e33f4ab2c6d5bce1b0c4607961bb1a3f7a1 # v1.1.2
        with:
          node-version-file: ".node-version"
          cache: true
          run-install: true
      - shell: bash
        run: vp test

  # Wails v2 uses native WebViews and CGO, so each platform must be built on its
  # own native runner (cross-compilation is not supported).
  build:
    name: build ${{ matrix.artifact_name }}
    needs: [test, test-web]
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: windows-latest
            platform: windows/amd64
            exec_name: pear-desktop-twitch-song-requests_windows_x64.exe
            artifact_name: pear-desktop-twitch-song-requests_windows_x64
          - runner: windows-11-arm
            platform: windows/arm64
            exec_name: pear-desktop-twitch-song-requests_windows_on_arm.exe
            artifact_name: pear-desktop-twitch-song-requests_windows_on_arm
          - runner: ubuntu-latest
            platform: linux/amd64
            exec_name: pear-desktop-twitch-song-requests_linux_amd64
            artifact_name: pear-desktop-twitch-song-requests_linux_amd64
          - runner: ubuntu-24.04-arm
            platform: linux/arm64
            exec_name: pear-desktop-twitch-song-requests_linux_arm64
            artifact_name: pear-desktop-twitch-song-requests_linux_arm64
          - runner: macos-26-intel
            platform: darwin/amd64
            exec_name: pear-desktop-twitch-song-requests_macos_intel
            artifact_name: pear-desktop-twitch-song-requests_macos_intel
          - runner: macos-26
            platform: darwin/arm64
            exec_name: pear-desktop-twitch-song-requests_macos_apple_silicon
            artifact_name: pear-desktop-twitch-song-requests_macos_apple_silicon
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - uses: voidzero-dev/setup-vp@2dec1e33f4ab2c6d5bce1b0c4607961bb1a3f7a1 # v1.1.2
        with:
          node-version-file: ".node-version"
          cache: true
          run-install: true
      - uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6.4.0
        with:
          go-version-file: go.mod
      - name: Install Linux Wails dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.1-dev
      - name: Install Wails CLI
        run: go install github.com/wailsapp/wails/v2/cmd/wails@v2.12.0
      - name: Build frontend
        shell: bash
        run: vp run build
      - name: Build desktop app
        shell: bash
        working-directory: cmd/main
        run: |
          wails build -s -skipbindings -m -trimpath \
            -platform "${{ matrix.platform }}" \
            -ldflags "-X main.version=v0.0.0+${{ github.sha }}" \
            -o "${{ matrix.exec_name }}"
      - name: Stage artifact
        shell: bash
        run: |
          mkdir -p dist
          if [[ '${{ runner.os }}' == 'macOS' ]]; then
            app="$(ls -d cmd/main/build/bin/*.app | head -n1)"
            ditto -c -k --keepParent "$app" "dist/${{ matrix.artifact_name }}.zip"
          else
            cp "cmd/main/build/bin/${{ matrix.exec_name }}" "dist/${{ matrix.exec_name }}"
          fi
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ matrix.artifact_name }}
          path: dist/*
          compression-level: 0
          if-no-files-found: error
          archive: false
