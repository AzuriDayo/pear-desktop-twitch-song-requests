name: Build nightly

on:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v6
    - uses: actions/setup-go@v6
      with:
        go-version-file: go.mod
    - run: |
        mkdir -p cmd/main/build
        touch cmd/main/build/index.html
        go test ./...
  build-and-publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - uses: pnpm/action-setup@91ab88e2619ed1f46221f0ba42d1492c02baf788 # v6.0.6
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6.4.0
        with:
          go-version-file: go.mod
      - shell: bash
        run: |
          pnpm i --frozen-lockfile
          pnpm run -r build
          rm -rf cmd/main/build
          mv control-panel/build cmd/main
          GIT_SHORT_TAG="v0.0.0+${{ github.sha }}" ./build_dist.sh
      - uses: actions/upload-artifact@v7
        with:
          name: pear-desktop-twitch-song-requests_windows_x64
          path: pear-desktop-twitch-song-requests_windows_x64.exe
          compression-level: 0
          if-no-files-found: error
          archive: false
      - uses: actions/upload-artifact@v7
        with:
          name: pear-desktop-twitch-song-requests_windows_on_arm
          path: pear-desktop-twitch-song-requests_windows_on_arm.exe
          compression-level: 0
          if-no-files-found: error
          archive: false
      - uses: actions/upload-artifact@v7
        with:
          name: pear-desktop-twitch-song-requests_macos_intel
          path: pear-desktop-twitch-song-requests_macos_intel
          compression-level: 0
          if-no-files-found: error
          archive: false
      - uses: actions/upload-artifact@v7
        with:
          name: pear-desktop-twitch-song-requests_macos_apple_silicon
          path: pear-desktop-twitch-song-requests_macos_apple_silicon
          compression-level: 0
          if-no-files-found: error
          archive: false
      - uses: actions/upload-artifact@v7
        with:
          name: pear-desktop-twitch-song-requests_linux_amd64
          path: pear-desktop-twitch-song-requests_linux_amd64
          compression-level: 0
          if-no-files-found: error
          archive: false
      - uses: actions/upload-artifact@v7
        with:
          name: pear-desktop-twitch-song-requests_linux_arm64
          path: pear-desktop-twitch-song-requests_linux_arm64
          compression-level: 0
          if-no-files-found: error
          archive: false
